[phases.setup]
nixPkgs = ["nodejs", "postgresql"]

[phases.install]
cmds = [
  "cd client && npm install",
  "cd server && npm install"
]

[phases.build]
cmds = [
  "cd client && npm run build",
  "cd server && npm run build"
]

[start]
cmd = "cd server && npm start"

[environment]
NODE_ENV = "production"
NODE_VERSION = "20"